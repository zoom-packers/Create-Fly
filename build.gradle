// NeoForge 26.3 build of Create Fly, maintained for Zoompack 5.
// Mirrors ZP5's mods/build-logic/src/main/groovy/zp5.neoforge-mod.gradle, but keeps upstream's split
// main/client source sets so the tree stays rebaseable on ZurrTum/Create-Fly.
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

repositories {
    def addGroup = { String url, String... groups ->
        exclusiveContent {
            forRepository {
                maven {
                    it.url = url
                }
            }
            filter {
                groups.each {
                    includeGroup it
                }
            }
        }
    }
    addGroup("https://maven.blamejared.com", "mezz.jei", "net.mezzdev.config")
    addGroup("https://api.modrinth.com/maven", "maven.modrinth")
}

def modId = project.mod_id

version = "${project.mod_version}+neoforge-${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Mojang ships Java 25 with 26.x, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        java {
            // Recipe viewers other than JEI are not ported (see PORTING.md)
            exclude 'com/zurrtum/create/compat/rei/**'
            exclude 'com/zurrtum/create/compat/eiv/**'
            exclude 'com/zurrtum/create/mixin/ArchitecturyMixin.java'
            // Fabric API bridges, replaced by com/zurrtum/create/neoforge/** (see PORTING.md)
            exclude 'com/zurrtum/create/compat/fabric/**'
            exclude 'com/zurrtum/create/mixin/MenuProviderMixin.java'
            exclude 'com/zurrtum/create/mixin/ReloadListenerMixin.java'
            exclude 'com/zurrtum/create/mixin/IngredientMixin.java'
            // 26.3 removed FuelValues; fuels are cooking_fuel components (CreateNeoForge#addFuels)
            exclude 'com/zurrtum/create/mixin/FuelValuesMixin.java'
            // Replaced by NeoForge IBlockExtension hooks (see foundation/block/*ControlBlock)
            ['AbstractBoatMixin', 'ExperienceOrbMixin', 'ItemEntityMixin', 'LeashableMixin', 'SignalGetterMixin',
             'ExplosionDamageCalculatorMixin'].each {
                exclude "com/zurrtum/create/mixin/${it}.java"
            }
            exclude 'com/zurrtum/create/foundation/recipe/ComponentsIngredient.java'
            exclude 'com/zurrtum/create/foundation/blockEntity/behaviour/CachedInventoryBehaviour.java'
            exclude 'com/zurrtum/create/foundation/blockEntity/behaviour/CachedDirectionInventoryBehaviour.java'
            exclude 'com/zurrtum/create/foundation/blockEntity/behaviour/CachedFluidInventoryBehaviour.java'
            ['FluidInventorySlotWrapper', 'FluidInventoryStorage', 'FluidInventoryStorageImpl', 'FluidInventoryWrapper',
             'FluidItemContext', 'FluidItemInventoryWrapper', 'InventoryWrapper', 'SidedFluidInventorySlotWrapper',
             'SidedFluidInventoryStorageImpl', 'SingleFluidStackStorage'].each {
                exclude "com/zurrtum/create/infrastructure/transfer/${it}.java"
            }
        }
        resources {
            // Fabric-only metadata and data
            exclude 'fabric.mod.json'
            exclude 'create.classtweaker'
            exclude '_data'
            // Fabric convention tags, only used without Fabric API; NeoForge ships its own c: tags
            exclude 'data/fabric/**'
            // Trinkets is Fabric-only
            exclude 'data/trinkets/**'
        }
    }
    client {
        compileClasspath += main.output
        runtimeClasspath += main.output
        java {
            exclude 'com/zurrtum/create/client/compat/rei/**'
            exclude 'com/zurrtum/create/client/compat/eiv/**'
            exclude 'com/zurrtum/create/client/compat/rrv/**'
            // Trinkets is Fabric-only; Curios support is a TODO (see PORTING.md)
            exclude 'com/zurrtum/create/client/compat/trinkets/**'
            exclude 'com/zurrtum/create/client/mixin/CraftingViewRecipeAccessor.java'
            exclude 'com/zurrtum/create/client/mixin/FabricEIVMixin.java'
            exclude 'com/zurrtum/create/client/mixin/FluidItemSpecialRendererMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ItemSlotMixin.java'
            exclude 'com/zurrtum/create/client/mixin/RecipeViewMenuMixin.java'
            exclude 'com/zurrtum/create/client/mixin/RecipeViewScreenMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ViewTypeButtonMixin.java'
            exclude 'com/zurrtum/create/client/flywheel/lib/model/baked/DualVertexConsumer.java'
            exclude 'com/zurrtum/create/client/mixin/ItemFeatureRendererMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ModelMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ModelPartMixin.java'
            // NeoForge merged the RETURN it injected at; replaced by InputEvent.Key (CreateClientInput)
            exclude 'com/zurrtum/create/client/mixin/KeyboardHandlerMixin.java'
            // Fabric API (FRAPI, transfer rendering) bridges; NeoForge uses the vanilla-only code paths
            exclude 'com/zurrtum/create/client/compat/fabric/**'
            exclude 'com/zurrtum/create/client/flywheel/lib/model/baked/FabricEmitterSupplier.java'
            exclude 'com/zurrtum/create/client/foundation/model/FabricBakedModelHelper.java'
            ['BufferAoPoseEmitterMixin', 'BufferColorPoseEmitterMixin', 'BufferEmitterMixin', 'BufferPoseEmitterMixin',
             'ConnectedTextureBehaviourMixin', 'CopycatModelMixin', 'CopycatPanelModelMixin', 'CopycatStepModelMixin',
             'ItemModelRenderHelperMixin', 'ModelRenderHelperMixin', 'SimpleModelPartMixin',
             'WrapperBlockStateModelAccessor', 'WrapperBlockStateModelMixin', 'RrvRecipeViewMenuMixin',
             'RrvRecipeViewScreenMixin'].each {
                exclude "com/zurrtum/create/client/mixin/${it}.java"
            }
        }
        resources {
            // Fabric API translations, only used without Fabric API
            exclude 'assets/fabric/**'
        }
    }
    // Dev-only client smoke test for the clientSmoke run; not part of the jar
    devclient {
        compileClasspath += main.output + client.output
        runtimeClasspath += main.output + client.output
    }
}

configurations {
    clientCompileOnly.extendsFrom compileOnly
    clientImplementation.extendsFrom implementation
    // Runtime-only mods for the dev runs
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    clientRuntimeClasspath.extendsFrom localRuntime
    devclientRuntimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neo_version

    addModdingDependenciesTo sourceSets.client
    addModdingDependenciesTo sourceSets.devclient

    // Compile-time view of the interfaces ContainerMixin/WorldlyContainerMixin add at runtime
    interfaceInjectionData {
        from file('interfaces.json')
    }

    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
            // -PserverOnly runs the server side without building the client source set
            if (!project.hasProperty('serverOnly')) {
                sourceSet(sourceSets.client)
            }
        }
        create_devclient {
            sourceSet(sourceSets.devclient)
        }
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.client
            loadedMods = [mods."${modId}"]
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }
        server {
            server()
            loadedMods = [mods."${modId}"]
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
            loadedMods = [mods."${modId}"]
        }
        // Scripted client check (src/devclient): title screen, a flat world, a water wheel driving a press,
        // screenshots in run-smoke/screenshots, then the client quits by itself
        clientSmoke {
            client()
            sourceSet = sourceSets.devclient
            gameDirectory = project.file('run-smoke')
            systemProperty 'create.clientSmoke', 'true'
            // -PsmokeScenarios=press,contraption,oit,ponder,jei,creative (default press); -PsmokeTag=name- prefixes screenshots
            systemProperty 'create.clientSmoke.scenarios', project.findProperty('smokeScenarios') ?: 'press'
            systemProperty 'create.clientSmoke.tag', project.findProperty('smokeTag') ?: ''
            // -PsmokeProps=key=value,key2=value2 adds extra system properties (debugging aid)
            if (project.hasProperty('smokeProps')) {
                project.property('smokeProps').toString().split(',').each { String kv -> def p = kv.split('=', 2); systemProperty p[0], p.length > 1 ? p[1] : 'true' }
            }
            loadedMods = [mods."${modId}", mods.create_devclient]
        }
        // Control for clientSmoke: the same vanilla blocks without Create loaded
        clientSmokeVanilla {
            client()
            sourceSet = sourceSets.devclient
            gameDirectory = project.file('run-smoke-vanilla')
            systemProperty 'create.clientSmoke', 'true'
            systemProperty 'create.clientSmoke.vanilla', 'true'
            loadedMods = [mods.create_devclient]
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
            if (project.hasProperty('disableMixins')) {
                systemProperty 'create.debug.disableMixins', project.property('disableMixins')
            }
            if (project.hasProperty('mixinDebug')) {
                systemProperty 'mixin.debug.verbose', 'true'
                systemProperty 'mixin.debug.export', 'true'
                systemProperty 'mixin.checks.interfaces', 'true'
            }
            // Diagnostics: log every failed injection instead of stopping at the first required one
            if (project.hasProperty('mixinScan')) {
                systemProperty 'mixin.ignoreRequired', 'true'
                systemProperty 'mixin.debug.countInjections', 'true'
                systemProperty 'mixin.debug.verbose', 'true'
            }
        }
    }
}

configurations {
    // Mods whose classes ship as jar-in-jar; their nested jars are put on the compile classpath
    jarJarCompileOnly
}

dependencies {
    clientCompileOnly "mezz.jei:jei-${project.jei_version}"
    compileOnly "maven.modrinth:cc-tweaked:${project.cct_version}"
    // Sodium for NeoForge nests the real mod jar under META-INF/jarjar
    jarJarCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
    clientCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
    clientCompileOnly "maven.modrinth:iris:${project.iris_version}"
    devclientCompileOnly "mezz.jei:jei-${project.jei_version}"
    // Optional mods for the dev runs: -PwithJei, -PwithSodium (Sodium + Iris)
    if (project.hasProperty('withJei')) {
        localRuntime "mezz.jei:jei-${project.jei_version}"
    }
    if (project.hasProperty('withSodium')) {
        localRuntime "maven.modrinth:sodium:${project.sodium_version}"
        localRuntime "maven.modrinth:iris:${project.iris_version}"
    }
}

var extractJarJarCompileOnly = tasks.register('extractJarJarCompileOnly', Sync) {
    from(configurations.jarJarCompileOnly.incoming.files.elements.map { it.collect { zipTree(it.asFile) } }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { path = name }
    }
    into layout.buildDirectory.dir('jarjar-compile')
    includeEmptyDirs = false
}
dependencies {
    clientCompileOnly files(extractJarJarCompileOnly.map { it.destinationDir.listFiles() ?: [] }).builtBy(extractJarJarCompileOnly)
}

// Expands ${...} placeholders in src/main/templates (neoforge.mods.toml) from gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: project.minecraft_version_range,
            neo_version_range      : project.neo_version_range,
            mod_id                 : modId,
            mod_version            : project.version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
    options.release = 25
}

java {
    withSourcesJar()
}

tasks.named('sourcesJar', Jar) {
    from sourceSets.client.allJava
    from("LICENSE")
    from("licenses") {
        into "licenses"
    }
}

jar {
    from sourceSets.client.output
    from("LICENSE")
    from("licenses") {
        into "licenses"
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
